name: Deploy site

on:
  push:
    branches: [main]

concurrency:
  group: github-pages-deploy
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set cache-busting version
        run: |
          export VERSION="$(date +%Y%m%d%H%M%S)-${GITHUB_RUN_NUMBER}"
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          index_path = Path("index.html")
          text = index_path.read_text(encoding="utf-8")
          text = re.sub(r"stylesheet\.css\?v=[^\"']+", f"stylesheet.css?v={version}", text)
          text = re.sub(r"stylesheet\.css\b", f"stylesheet.css?v={version}", text)
          index_path.write_text(text, encoding="utf-8")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
