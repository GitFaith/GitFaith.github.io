name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add cache-busting version
        run: |
          VERSION="${GITHUB_SHA::7}"
          export VERSION
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          text = re.sub(r"stylesheet\.css\?v=[^\"']+", f"stylesheet.css?v={version}", text)
          text = re.sub(r"stylesheet\.css\b", f"stylesheet.css?v={version}", text)

          for folder in ("Images", "GIFS", "Music"):
              text = re.sub(rf"({folder}/[^\"']+)(?<!\?v=)", rf"\1?v={version}", text)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
